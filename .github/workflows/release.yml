name: Build & Release (Electron)
run-name: "chore(release): ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate config.js
        shell: bash
        env:
          TPV_API_KEY: ${{ secrets.TPV_API_KEY }}
        run: |
          if [ -z "$TPV_API_KEY" ]; then
            echo "::error::Falta el secret TPV_API_KEY en este repositorio."
            exit 1
          fi
          cat > config.js <<EOF
          // Configuración de la API de Recipok / FacturaScripts
          window.RECIPOK_API = {
            baseUrl: "",
            apiKey: "",
            defaultCodClienteTPV: "1",
            defaultCodPagoTPV: "CONT",
            defaultCodSerieTPV: "T",
          };

          window.TPV_CONFIG = {
            resolverUrl: "https://plus.recipok.com/tpv/clients.json",
            tpvSyncApiUrl: "https://plus.recipok.com/tpv/api/index.php",
            tpvApiKey: "$TPV_API_KEY",
          };
          EOF

      - name: Build & Publish (Windows - Stable)
        if: matrix.os == 'windows-2022' && !contains(github.ref_name, '-beta.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:win

      - name: Build & Publish (Windows - Beta)
        if: matrix.os == 'windows-2022' && contains(github.ref_name, '-beta.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:win:beta
