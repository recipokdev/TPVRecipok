<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      @page {
        size: 80mm auto;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      #comanda {
        width: 72mm;
        padding: 0 2mm;
        color: #000;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New",
          monospace;
        font-size: 12px;
        line-height: 1.25;
      }

      .center {
        text-align: center;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .sep {
        border-top: 1px dashed #000;
        margin: 8px 0;
      }

      .title {
        text-align: center;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.7px;
      }

      .mesa-big {
        text-align: center;
        font-size: 32px;
        line-height: 1;
        font-weight: 900;
        margin: 6px 0 2px;
      }

      .meta {
        font-size: 11px;
      }

      .items-head {
        display: grid;
        grid-template-columns: 14mm 1fr;
        gap: 4px;
        font-size: 11px;
        opacity: 0.85;
      }

      .comanda-item {
        display: grid;
        grid-template-columns: 14mm 1fr;
        gap: 4px;
        align-items: start;
        margin: 2px 0;
      }

      .comanda-qty {
        font-weight: 800;
      }

      .comanda-desc {
        word-break: break-word;
      }

      .comanda-desc-addons {
        font-weight: 800;
        font-size: 12px;
        margin-top: 1px;
      }

      .comanda-desc-allergens {
        font-weight: 800;
        font-size: 14px;
        margin-top: 2px;
        border: 1px solid #000;
        padding: 1px 3px;
        display: inline-block;
      }

      /* Devolver a cocina (app de camareros, 2026-10-08): tiene que ser
         imposible de confundir con un pedido nuevo en una impresora
         termica monocromo -- fondo invertido (negro sobre blanco), no solo
         negrita, igual que ya se hizo con los alergenos por el mismo
         motivo. */
      .comanda-return-banner {
        text-align: center;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.5px;
        background: #000;
        color: #fff;
        padding: 4px 2px;
        margin: 4px 0;
      }

      /* Reimpresion de una comanda ya enviada (2026-10-21): imposible de confundir con un pedido nuevo. */
      .comanda-reprint-banner {
        text-align: center;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.5px;
        border: 2px solid #000;
        padding: 3px 2px;
        margin: 4px 0;
      }

      /* Comanda agrupada por familias (2026-10-21): la familia una vez y sus productos debajo. */
      .comanda-family {
        font-weight: 900;
        font-size: 13px;
        text-transform: uppercase;
        border-bottom: 1px solid #000;
        margin: 6px 0 2px;
        padding-bottom: 1px;
      }

      /* Subfamilia (2026-10-21): debajo de la familia grande, con sus productos debajo. */
      .comanda-subfamily {
        font-weight: 800;
        font-size: 12px;
        margin: 4px 0 1px 4px;
        padding-left: 4px;
        border-left: 3px solid #000;
      }

      .comanda-desc-return-tag {
        font-weight: 900;
        font-size: 13px;
        margin-top: 1px;
        background: #000;
        color: #fff;
        padding: 1px 3px;
        display: inline-block;
      }

      /* Comanda compacta (opcional, 2026-10-23): menos papel. */
      .meta-compact {
        display: none;
        text-align: center;
        font-size: 11px;
      }
      #comanda.compact .title {
        font-size: 14px;
      }
      #comanda.compact .mesa-big {
        font-size: 22px;
        margin: 2px 0;
      }
      #comanda.compact .sep {
        margin: 3px 0;
      }
      #comanda.compact .meta,
      #comanda.compact .items-head,
      #comanda.compact .items-head + .sep,
      #comanda.compact .row.meta + .sep {
        display: none !important;
      }
      #comanda.compact .meta-compact {
        display: block;
      }
      #comanda.compact .comanda-item {
        margin: 1px 0;
      }
      #comanda.compact .comanda-family {
        margin: 3px 0 1px;
      }

      .obs-title {
        font-size: 11px;
        font-weight: 700;
      }

      .obs-text {
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="comanda">
      <div class="title" id="comandaTitle">COMANDA</div>
      <div
        class="comanda-return-banner"
        id="comandaReturnBanner"
        style="display: none"
      >
        ⚠ DEVOLVER A COCINA ⚠
      </div>
      <div
        class="comanda-reprint-banner"
        id="comandaReprintBanner"
        style="display: none"
      >
        REIMPRESIÓN
      </div>
      <div class="mesa-big" id="comandaMesaBig">MESA</div>
      <div class="meta-compact" id="comandaCompactMeta"></div>

      <div class="sep"></div>

      <div class="meta">Mesa: <span id="comandaMesa">-</span></div>
      <div class="meta">Agente: <span id="comandaAgent">-</span></div>
      <div class="meta" id="comandaPartRow" style="display: none">
        Parte: <span id="comandaPart">-</span>
      </div>
      <div class="row meta">
        <div>Fecha: <span id="comandaDate">--/--/----</span></div>
        <div>Hora: <span id="comandaTime">--:--</span></div>
      </div>

      <div class="sep"></div>

      <div class="items-head">
        <div>Cant.</div>
        <div>Producto / Ref.</div>
      </div>
      <div class="sep"></div>

      <div id="comandaItems"></div>

      <div class="sep"></div>

      <div id="comandaObsBlock">
        <div class="obs-title">Observaciones</div>
        <div class="obs-text" id="comandaObs">Sin observaciones</div>
      </div>
    </div>
  </body>
</html>
