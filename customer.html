<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: ws:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'"
    />
    <title>TPV Cliente</title>
    <link rel="stylesheet" href="./customer.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="topRow">
          <div class="title">🛒CARRITO</div>
          <div class="clock" id="clock"></div>
        </div>

        <div class="sub" id="subLine">---</div>

        <!-- ✅ notice flotante, NO ocupa espacio -->
        <div id="notice" class="notice hidden">
          <div class="noticeTitle" id="noticeTitle"></div>
          <div class="noticeSub" id="noticeSub"></div>
        </div>
      </header>

      <main class="list">
        <div class="listInner" id="items"></div>
        <div id="stateOverlay" class="state-overlay hidden" aria-live="polite">
          <div class="state-card">
            <div class="state-title" id="stateTitle">CAJA CERRADA</div>
            <div class="state-sub" id="stateSub">---</div>
          </div>
        </div>
      </main>

      <footer class="bottom">
        <div class="total">
          <div class="label">TOTAL</div>
          <div class="amount" id="total">0,00 €</div>
        </div>
      </footer>
    </div>

    <div id="thanksOverlay" class="thanks-overlay hidden">
      <div class="thanks-card">
        <div class="thanks-title">Pago realizado</div>
        <div class="thanks-sub">Gracias por su compra. Hasta pronto.</div>
        <div class="thanks-timer" aria-live="polite"></div>
      </div>
    </div>

    <script src="./customer.js"></script>
  </body>
</html>
