<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TPV Cliente</title>
    <link rel="stylesheet" href="./customer.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="topRow">
          <div class="title">🛒CARRITO</div>
          <div class="clock" id="clock"></div>
        </div>

        <div class="sub" id="subLine">---</div>

        <!-- ✅ notice flotante, NO ocupa espacio -->
        <div id="notice" class="notice hidden">
          <div class="noticeTitle" id="noticeTitle"></div>
          <div class="noticeSub" id="noticeSub"></div>
        </div>
      </header>

      <main class="list">
        <div class="listInner" id="items"></div>
      </main>

      <footer class="bottom">
        <div class="total">
          <div class="label">TOTAL</div>
          <div class="amount" id="total">0,00 €</div>
        </div>
      </footer>
    </div>

    <script src="./customer.js"></script>
  </body>
</html>
