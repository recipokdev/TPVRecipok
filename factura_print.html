<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      @page {
        size: A4;
        margin: 12mm;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      #invoice {
        width: 100%;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        color: #1a1a1a;
        --color1: #2770ca;
        --color2: #ffffff;
        --color3: #f1f1f1;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 3px solid var(--color1);
        padding-bottom: 10px;
        margin-bottom: 16px;
      }

      #companyLogo {
        max-width: 55mm;
        max-height: 22mm;
        display: none;
      }

      .company-block {
        max-width: 60%;
      }

      .company-name {
        font-size: 18px;
        font-weight: 700;
        color: var(--color1);
      }

      .muted {
        opacity: 0.8;
      }

      .small {
        font-size: 11px;
      }

      .invoice-title-block {
        text-align: right;
      }

      .invoice-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--color1);
        text-transform: uppercase;
      }

      .parties {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .party-box {
        flex: 1;
        background: var(--color3);
        border-radius: 4px;
        padding: 10px 12px;
      }

      .party-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-weight: 700;
        opacity: 0.7;
        margin-bottom: 4px;
      }

      table.lines {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 16px;
      }

      table.lines thead th {
        background: var(--color1);
        color: var(--color2);
        text-align: left;
        font-size: 11px;
        font-weight: 700;
        padding: 6px 8px;
      }

      table.lines thead th.num {
        text-align: right;
      }

      table.lines tbody td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--color3);
        font-size: 12px;
        vertical-align: top;
      }

      table.lines tbody td.num {
        text-align: right;
        white-space: nowrap;
      }

      .totals {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 20px;
      }

      .totals-box {
        width: 60mm;
      }

      .totals-row {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
        font-size: 12px;
      }

      .totals-row.grand {
        border-top: 2px solid var(--color1);
        margin-top: 4px;
        padding-top: 6px;
        font-size: 15px;
        font-weight: 700;
        color: var(--color1);
      }

      .footer-legal {
        border-top: 1px solid var(--color3);
        padding-top: 10px;
        font-size: 8px;
        opacity: 0.75;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="invoice">
      <div class="header">
        <div class="company-block">
          <img id="companyLogo" src="" alt="Logo" />
          <div class="company-name" id="companyShortName">—</div>
          <div class="small" id="companyLegalName"></div>
          <div class="small" id="companyAddress"></div>
          <div class="small">
            <span id="companyZip"></span><span id="companyCity"></span>
          </div>
          <div class="small">NIF/CIF: <span id="companyCif">—</span></div>
          <div class="small" id="companyPhoneRow" style="display: none">
            <span id="companyPhone"></span>
          </div>
        </div>
        <div class="invoice-title-block">
          <div class="invoice-title" id="invoiceLabel">Factura</div>
          <div>Nº <span id="invoiceNumber">—</span></div>
          <div class="small">Fecha: <span id="invoiceDate">—</span></div>
        </div>
      </div>

      <div class="parties">
        <div class="party-box">
          <div class="party-title">Cliente</div>
          <div class="bold" id="clientName">—</div>
          <div class="small" id="clientFiscalRow" style="display: none">
            NIF/CIF: <span id="clientFiscal"></span>
          </div>
          <div class="small" id="clientAddressRow" style="display: none">
            <span id="clientAddress"></span>
          </div>
        </div>
      </div>

      <table class="lines">
        <thead>
          <tr>
            <th>Ref.</th>
            <th>Descripción</th>
            <th class="num">Cant.</th>
            <th class="num">Precio</th>
            <th class="num">IVA</th>
            <th class="num">Importe</th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>

      <div class="totals">
        <div class="totals-box">
          <div id="taxSummary"></div>
          <div class="totals-row grand">
            <div>Total</div>
            <div id="grandTotal">0,00 €</div>
          </div>
        </div>
      </div>

      <div class="footer-legal" id="legalFooter"></div>
    </div>
  </body>
</html>
