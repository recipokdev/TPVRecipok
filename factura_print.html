<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      @page {
        size: A4;
        margin: 12mm;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      #invoice {
        width: 100%;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        color: #1a1a1a;
        --color1: #2770ca;
        --color2: #ffffff;
        --color3: #f1f1f1;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
      }

      #companyLogo {
        max-width: 55mm;
        max-height: 22mm;
        display: none;
      }

      .company-block {
        max-width: 60%;
      }

      .company-name {
        font-size: 15px;
        font-weight: 700;
      }

      .muted {
        opacity: 0.8;
      }

      .small {
        font-size: 11px;
      }

      .company-block-right {
        text-align: right;
      }

      .invoice-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--color1);
        color: var(--color2);
        border-radius: 3px;
        padding: 8px 12px;
        margin-bottom: 14px;
      }

      .invoice-bar-label {
        font-weight: 700;
        text-transform: uppercase;
        font-size: 13px;
      }

      .invoice-bar-date,
      .invoice-bar-total {
        font-weight: 700;
        font-size: 13px;
      }

      .parties {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .party-box {
        flex: 1;
      }

      .party-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-weight: 700;
        opacity: 0.7;
        margin-bottom: 4px;
      }

      .party-right {
        text-align: right;
      }

      table.lines,
      table.tax-summary,
      table.recibos {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 16px;
      }

      table.lines thead th,
      table.tax-summary thead th,
      table.recibos thead th {
        background: var(--color1);
        color: var(--color2);
        text-align: left;
        font-size: 11px;
        font-weight: 700;
        padding: 6px 8px;
      }

      table.lines thead th.num,
      table.tax-summary thead th.num,
      table.recibos thead th.num {
        text-align: right;
      }

      table.lines tbody td,
      table.tax-summary tbody td,
      table.recibos tbody td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--color3);
        font-size: 12px;
        vertical-align: top;
      }

      table.lines tbody td.num,
      table.tax-summary tbody td.num,
      table.recibos tbody td.num {
        text-align: right;
        white-space: nowrap;
      }

      .totals-wrap {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 16px;
      }

      .tax-summary-col {
        flex: 1;
      }

      .grand-total-box {
        background: var(--color1);
        color: var(--color2);
        border-radius: 3px;
        padding: 10px 16px;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
      }

      .footer-legal {
        border-top: 1px solid var(--color3);
        padding-top: 10px;
        font-size: 8px;
        opacity: 0.75;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="invoice">
      <div class="header">
        <div class="company-block">
          <div class="company-name" id="companyShortName">—</div>
          <div class="small" id="companyLegalName"></div>
          <div class="small" id="companyCifRow">
            CIF: <span id="companyCif">—</span>
          </div>
          <div class="small" id="companyAddress"></div>
          <div class="small">
            <span id="companyZip"></span><span id="companyCity"></span>
          </div>
          <div class="small" id="companyPhoneRow" style="display: none">
            <span id="companyPhone"></span>
          </div>
        </div>
        <div class="company-block-right">
          <img id="companyLogo" src="" alt="" style="max-height: 18mm; display: none" />
        </div>
      </div>

      <div class="invoice-bar">
        <div class="invoice-bar-label" id="invoiceLabel">
          Factura Simplificada —
        </div>
        <div class="invoice-bar-date" id="invoiceDate">—</div>
        <div class="invoice-bar-total" id="invoiceBarTotal">0,00 €</div>
      </div>

      <div class="parties">
        <div class="party-box">
          <div class="party-title">Cliente</div>
          <div class="bold" id="clientName">—</div>
          <div class="small" id="clientFiscalRow" style="display: none">
            NIF/CIF: <span id="clientFiscal"></span>
          </div>
          <div class="small" id="clientAddressRow" style="display: none">
            <span id="clientAddress"></span>
          </div>
        </div>
        <div class="party-box party-right">
          <div class="small">
            Número: <span id="invoiceNumber2">—</span>
          </div>
          <div class="small">
            Serie: <span id="invoiceSerie">—</span>
          </div>
        </div>
      </div>

      <table class="lines">
        <thead>
          <tr>
            <th>Referencia</th>
            <th>Descripción</th>
            <th class="num">Cant.</th>
            <th class="num">Precio</th>
            <th class="num">Neto</th>
            <th class="num">Imp.</th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>

      <div class="totals-wrap">
        <div class="tax-summary-col">
          <table class="tax-summary">
            <thead>
              <tr>
                <th>Impuesto</th>
                <th class="num">Base Imponible</th>
                <th class="num">Porcentaje</th>
                <th class="num">Importe</th>
              </tr>
            </thead>
            <tbody id="taxSummary"></tbody>
          </table>
        </div>
        <div class="grand-total-box">TOTAL: <span id="grandTotal">0,00 €</span></div>
      </div>

      <table class="recibos" id="recibosTable" style="display: none">
        <thead>
          <tr>
            <th>Recibo</th>
            <th>Forma de Pago</th>
            <th class="num">Importe</th>
            <th class="num">Vencimiento</th>
          </tr>
        </thead>
        <tbody id="recibosBody"></tbody>
      </table>

      <div class="footer-legal" id="legalFooter"></div>
    </div>
  </body>
</html>
