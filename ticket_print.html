<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      @page {
        size: 80mm auto;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      #ticket {
        width: 70mm;
        padding: 0 2mm;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New",
          monospace;
        font-size: 12px;
        line-height: 1.25;
        color: #000;
      }

      .center {
        text-align: center;
      }
      .right {
        text-align: right;
      }
      .bold {
        font-weight: 700;
      }
      .muted {
        opacity: 0.9;
      }
      .small {
        font-size: 11px;
      }

      .sep {
        border-top: 1px dashed #000;
        margin: 8px 0;
      }

      /* Bloques tipo ticket */
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .col-left {
        flex: 1;
        min-width: 0;
      }
      .col-right {
        width: 18mm;
        text-align: right;
        white-space: nowrap;
      }

      /* Cabecera tabla */
      .thead {
        display: grid;
        grid-template-columns: 8mm 1fr 20mm; /* Cant | Ref | Total */
        column-gap: 4px;
        align-items: start;
      }
      .thead .qty {
        text-align: left;
      }
      .thead .ltotal {
        text-align: right;
        white-space: nowrap;
      }

      /* Línea */
      .item {
        margin: 2px 0;
      }

      /* Por defecto: 3 columnas */
      .item-top {
        display: grid;
        grid-template-columns: 8mm 1fr 20mm; /* Cant | Ref | Total */
        column-gap: 4px;
        align-items: start;
      }

      .qty {
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
      }

      .desc {
        min-width: 0;
        overflow: hidden;
        word-break: break-word;
      }

      .ltotal {
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
      }

      /* Sub-línea: que no “rompa” raro y ahorra espacio */
      .item-sub {
        max-width: 34ch;
        font-size: 10px; /* 👈 ayuda a que "Oferta de diferentes productos" no se vaya a 3 líneas */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ✅ HIJOS DE PACK: solo descripción */
      .item.pack-child .item-top {
        grid-template-columns: 1fr;
      }

      .item.pack-child .qty {
        display: none;
      }

      .item.pack-child .ltotal {
        display: none;
      }

      .item.pack-child .desc {
        padding-left: 2mm;
      }

      .item.pack-child .desc .muted {
        opacity: 0.75;
      }

      .ticket-badge {
        text-align: center;
        font-size: 10px;
        font-weight: 700;
        margin: 3px 0 2px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="ticket">
      <div class="center" style="padding: 6px 0">
        <img
          id="companyLogo"
          src=""
          alt="Logo"
          style="max-width: 60mm; max-height: 18mm; display: none"
        />
      </div>

      <!-- Empresa -->
      <div class="center bold" style="font-size: 16px" id="companyShortName">
        ---
      </div>
      <div class="center small muted" id="companyLegalName"></div>

      <div class="small" id="companyAddress"></div>
      <div class="small">
        CP: <span id="companyZip"></span><span id="companyCity"></span>
      </div>
      <div class="small">CIF: <span id="companyCif">---</span></div>

      <div class="sep"></div>

      <!-- Factura -->
      <div class="small"><span id="companyPhone"></span></div>
      <div class="small">
        <span id="invoiceLabel">Factura Simplificada</span>
        <span id="invoiceNumber">---</span>
      </div>
      <div
        id="ticketTypeBadge"
        class="ticket-badge"
        style="display: none"
      ></div>
      <div class="small">
        Fecha: <span id="ticketDate">--/--/---- --:--</span>
      </div>
      <div class="small">Cliente: <span id="clientName">---</span></div>

      <div class="sep"></div>

      <!-- Cabecera líneas -->
      <div class="thead small muted">
        <div class="qty">Cant.</div>
        <div class="desc">Ref.</div>
        <div class="ltotal">Total</div>
      </div>
      <div class="sep"></div>

      <!-- Líneas -->
      <div id="items"></div>

      <div class="sep"></div>

      <!-- Desglose IVA -->
      <div id="taxSummary"></div>

      <div class="sep"></div>

      <!-- Totales / Pagos (se rellena por JS) -->
      <div id="payments"></div>

      <div class="row small muted" id="cashRow" style="display: none">
        <div>Entregado</div>
        <div class="right" id="cashGiven">0,00</div>
      </div>
      <div class="row small muted" id="changeRow" style="display: none">
        <div>Cambio</div>
        <div class="right" id="changeCash">0,00</div>
      </div>

      <div class="sep"></div>

      <!-- TPV/Agente -->
      <div class="small">TPV: <span id="terminalName">---</span></div>
      <div class="small">Agente: <span id="agentName">---</span></div>

      <div class="sep"></div>

      <div class="center small">Gracias por su compra</div>
    </div>
  </body>
</html>
